[project]
name = "gym-bro"
version = "0.1.0"
description = "Telegram-бот: тренировки, прогрессия, напоминания, ИИ-тренер"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13,<4",
    "aiosqlite>=0.20",
    "apscheduler>=3.10,<4",
    "google-genai>=1.0",
    "groq>=0.13",
    "pydantic-settings>=2.4",
    "tzdata",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.setuptools]
packages = ["bot", "bot.handlers", "bot.services", "bot.db"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
